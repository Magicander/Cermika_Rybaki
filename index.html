<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --bg-2: #111111;
  --bg-3: #181818;
  --bg-4: #202020;
  --line: rgba(255,255,255,0.07);
  --line-strong: rgba(255,255,255,0.12);
  --text: #f0f0f0;
  --text-2: #888;
  --text-3: #555;
  --accent-dim: rgba(232,232,232,0.06);
  --r: 14px;
  --r-lg: 20px;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(10,10,10,0.9);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.header-left {
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.wordmark {
  font-family: 'DM Serif Display', serif;
  font-size: 19px;
  font-style: italic;
  letter-spacing: -0.3px;
  color: var(--text);
}
.header-meta {
  font-size: 12px;
  color: var(--text-3);
  font-weight: 400;
}

/* ── TOOLBAR ── */
.toolbar {
  max-width: 1280px;
  margin: 0 auto;
  padding: 18px 32px 14px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
.toolbar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.sort-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 500;
  margin-right: 4px;
}
.sort-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-2);
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 6px 13px;
  cursor: pointer;
  transition: color .18s, background .18s, border-color .18s;
  white-space: nowrap;
}
.sort-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.22); background: var(--accent-dim); }
.sort-btn.active { color: #0a0a0a; background: var(--text); border-color: var(--text); }

/* ── MAIN ── */
main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 32px 80px;
}

/* ── GRID ── */
.grid {
  display: grid;
  gap: 3px;
}
.grid.cols-1 { grid-template-columns: repeat(1, 1fr); }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

@media (max-width: 680px) {
  header { padding: 0 16px; }
  .toolbar { padding: 14px 16px 12px; }
  main { padding: 16px 16px 60px; }
  .card { animation: none; opacity: 1; }
  .lb-panel { flex-direction: column; }
  .lb-meta { display: none; }
  .lb-img-side {
    min-height: 0;
    max-height: calc(100vh - 48px);
    width: 100%;
  }
  .lb-arrow.next { right: 14px; }
}

/* ── CARD ── */
.card {
  position: relative;
  background: var(--bg-3);
  overflow: hidden;
  cursor: pointer;
  aspect-ratio: 1;
  opacity: 0;
  animation: fadeUp .4s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}
.card img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  position: relative;
  z-index: 1;
  transition: transform .5s cubic-bezier(.25,.46,.45,.94), filter .5s;
  background: var(--bg-3);
}
.card img:not([src]) { opacity: 0.35; }
.card:hover img { transform: scale(1.05); filter: brightness(.72); }

.card-hover {
  position: absolute;
  inset: 0;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  opacity: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.68) 0%, transparent 60%);
  transition: opacity .28s;
  z-index: 2;
}
.card:hover .card-hover { opacity: 1; }
.card-name {
  font-size: 12.5px;
  font-weight: 500;
  color: #fff;
  line-height: 1.3;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-date { font-size: 11px; color: rgba(255,255,255,0.5); }

/* ── EMPTY STATE ── */
.empty-state {
  grid-column: 1/-1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 80px 20px;
  color: var(--text-3);
}
.empty-state svg { width: 32px; height: 32px; opacity: .3; }
.empty-state span { font-size: 14px; }

.load-sentinel {
  grid-column: 1 / -1;
  height: 1px;
}

.load-status {
  grid-column: 1 / -1;
  text-align: center;
  padding: 28px 16px 8px;
  font-size: 12px;
  color: var(--text-3);
}

/* ── LIGHTBOX ── */
.lb {
  position: fixed;
  inset: 0;
  z-index: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity .26s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.lb.open { opacity: 1; pointer-events: all; }
.lb-bg {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
}
.lb-panel {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 1px;
  width: 100%;
  max-width: 1100px;
  max-height: calc(100vh - 48px);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  transform: translateY(16px) scale(.97);
  transition: transform .3s cubic-bezier(.34,1.4,.64,1);
  box-shadow: 0 40px 120px rgba(0,0,0,.7);
}
.lb.open .lb-panel { transform: translateY(0) scale(1); }

.lb-img-side {
  flex: 1 1 auto;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  min-height: 400px;
}
.lb-img-side img {
  width: 100%; height: 100%;
  max-height: calc(100vh - 48px);
  object-fit: contain;
  display: block;
  transition: opacity .22s;
}
.lb-meta {
  flex: 0 0 288px;
  background: var(--bg-2);
  border-left: 1px solid var(--line);
  padding: 26px 22px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.lb-filename {
  font-family: 'DM Serif Display', serif;
  font-size: 17px;
  font-style: italic;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 3px;
  word-break: break-word;
}
.lb-added { font-size: 12px; color: var(--text-3); margin-bottom: 22px; }

.meta-block { border-top: 1px solid var(--line); padding: 14px 0 0; margin-bottom: 14px; }
.meta-block-title {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 500;
  margin-bottom: 10px;
}
.meta-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 4px 0;
}
.meta-key { font-size: 12px; color: var(--text-3); flex-shrink: 0; }
.meta-val { font-size: 12px; color: var(--text-2); font-weight: 500; text-align: right; word-break: break-all; }
.meta-val.hi { color: var(--text); }

.lb-close {
  position: absolute;
  top: 13px; right: 13px;
  z-index: 10;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--line-strong);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .18s;
}
.lb-close:hover { background: rgba(255,255,255,.14); }
.lb-close svg { width: 13px; height: 13px; stroke: var(--text-2); stroke-width: 2; }

.lb-arrow {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  z-index: 10;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
  border: 1px solid var(--line-strong);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .18s;
}
.lb-arrow:hover { background: rgba(255,255,255,.14); }
.lb-arrow svg { width: 15px; height: 15px; stroke: var(--text-2); stroke-width: 2; }
.lb-arrow.prev { left: 13px; }
.lb-arrow.next { right: 304px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-left">
      <span class="wordmark">Ceramika</span>
      <span class="header-meta" id="hMeta">0 items</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-row">
      <span class="sort-label">Sort</span>
      <button class="sort-btn active" data-sort="newest" onclick="setSort(this,'newest')">Newest first</button>
      <button class="sort-btn" data-sort="oldest" onclick="setSort(this,'oldest')">Oldest first</button>
      <button class="sort-btn" data-sort="name" onclick="setSort(this,'name')">Name A – Z</button>
    </div>
    <div class="toolbar-row">
      <span class="sort-label">View</span>
      <button class="sort-btn view-btn" data-cols="1" onclick="setView(this, 1)">1 column</button>
      <button class="sort-btn view-btn" data-cols="2" onclick="setView(this, 2)">2 columns</button>
      <button class="sort-btn view-btn" data-cols="3" onclick="setView(this, 3)">3 columns</button>
    </div>
  </div>

  <main>
    <div class="grid cols-3" id="grid">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>No photos yet</span>
      </div>
    </div>
  </main>
</div>

<!-- ── LIGHTBOX ── -->
<div class="lb" id="lb" onclick="lbBgClick(event)">
  <div class="lb-bg"></div>
  <div class="lb-panel">
    <div class="lb-img-side"><img id="lbImg" src="" alt=""></div>
    <div class="lb-meta" id="lbMeta"></div>
    <button class="lb-close" onclick="closeLb()">
      <svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="lb-arrow prev" onclick="navLb(-1)">
      <svg viewBox="0 0 24 24" fill="none"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="lb-arrow next" onclick="navLb(1)">
      <svg viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>

<script src="Ceramika Rybaki/manifest.js"></script>
<script>
const DEFAULT_FOLDER = 'Ceramika Rybaki';
const THUMBS_FOLDER = 'thumbs';
const MOBILE_BREAKPOINT = 680;
const DESKTOP_PAGE_SIZE = 50;
const MOBILE_PAGE_SIZE = 36;

function getPageSize() {
  return window.innerWidth <= MOBILE_BREAKPOINT ? MOBILE_PAGE_SIZE : DESKTOP_PAGE_SIZE;
}

// ── EXIF PARSER (pure JS, no libs) ───────────────────────────
function readExif(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  if (view.getUint16(0) !== 0xFFD8) return {}; // not JPEG
  let offset = 2;
  while (offset < view.byteLength - 2) {
    const marker = view.getUint16(offset);
    if (marker === 0xFFE1) { // APP1 / EXIF
      return parseExifSegment(view, offset + 4);
    }
    if ((marker & 0xFF00) !== 0xFF00) break;
    offset += 2 + view.getUint16(offset + 2);
  }
  return {};
}

function parseExifSegment(view, start) {
  const header = String.fromCharCode(...[0,1,2,3].map(i => view.getUint8(start+i)));
  if (!header.startsWith('Exif')) return {};
  const tiffStart = start + 6;
  const endian = view.getUint16(tiffStart);
  const le = endian === 0x4949;
  const get16 = o => view.getUint16(tiffStart + o, le);
  const get32 = o => view.getUint32(tiffStart + o, le);
  const getString = (o, len) => {
    let s = '';
    for (let i = 0; i < len - 1; i++) {
      const c = view.getUint8(tiffStart + o + i);
      if (c === 0) break;
      s += String.fromCharCode(c);
    }
    return s.trim();
  };
  const getRational = o => {
    const num = get32(o), den = get32(o + 4);
    return den ? num / den : 0;
  };

  const result = {};
  const ifdOffset = get32(4);
  const numEntries = get16(ifdOffset);

  const TAGS = {
    0x0132: 'dateTime',
    0x9003: 'dateTimeOriginal',
    0x9004: 'dateTimeDigitized',
    0x010F: 'make',
    0x0110: 'model',
    0x829A: 'exposureTime',
    0x829D: 'fNumber',
    0x8827: 'iso',
    0x920A: 'focalLength',
    0x9209: 'flash',
    0xA002: 'pixelXDimension',
    0xA003: 'pixelYDimension',
  };

  for (let i = 0; i < numEntries; i++) {
    const eOff = ifdOffset + 2 + i * 12;
    const tag  = get16(eOff);
    const type = get16(eOff + 2);
    const count = get32(eOff + 4);
    const valOff = eOff + 8;

    if (!TAGS[tag]) continue;
    const key = TAGS[tag];

    try {
      if (type === 2) { // ASCII
        const dataOff = count > 4 ? get32(valOff) : valOff;
        result[key] = getString(dataOff, count);
      } else if (type === 3) { // SHORT
        result[key] = get16(valOff);
      } else if (type === 4) { // LONG
        result[key] = get32(valOff);
      } else if (type === 5) { // RATIONAL
        const dataOff = get32(valOff);
        result[key] = getRational(dataOff);
      }
    } catch(e) {}
  }
  return result;
}

function exifDateToMs(str) {
  if (!str) return null;
  // format: "2024:03:15 07:22:00"
  const m = str.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
  if (!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]).getTime();
}

function fmtExposure(v) {
  if (!v) return null;
  if (v >= 1) return v.toFixed(1) + 's';
  return '1/' + Math.round(1/v) + 's';
}
function fmtFStop(v) { return v ? 'f/' + v.toFixed(1) : null; }
function fmtFocal(v) { return v ? Math.round(v) + ' mm' : null; }

// ── PHOTOS ────────────────────────────────────────────────────
let allPhotos = [];
let sorted    = [];
let curIdx    = 0;
let sortMode  = 'newest';
let viewModeManual = false;
let renderedCount = 0;
let isLoadingMore = false;
let loadMoreObserver = null;

function getDefaultViewMode() {
  return window.innerWidth <= MOBILE_BREAKPOINT ? 1 : 3;
}

let viewMode = getDefaultViewMode();

function applyViewMode() {
  const grid = document.getElementById('grid');
  grid.classList.remove('cols-1', 'cols-2', 'cols-3');
  grid.classList.add(`cols-${viewMode}`);
}

function updateViewButtons() {
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.cols, 10) === viewMode);
  });
}

function setView(btn, cols) {
  viewModeManual = true;
  viewMode = cols;
  applyViewMode();
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function folderPath() {
  return DEFAULT_FOLDER.split('/').map(part => encodeURIComponent(part)).join('/');
}

function folderImageUrl(filename) {
  return `${folderPath()}/${encodeURIComponent(filename)}`;
}

function folderThumbUrl(filename) {
  return `${folderPath()}/${THUMBS_FOLDER}/${encodeURIComponent(filename)}`;
}

function buildPhotosFromManifest() {
  const raw = window.GALLERY_MANIFEST || [];
  allPhotos = raw.map(entry => {
    const filename = typeof entry === 'string' ? entry : entry.file;
    const takenMs = typeof entry === 'object' && entry.takenMs ? entry.takenMs : null;
    const ext = (filename.match(/\.([^.]+)$/) || ['', ''])[1].toUpperCase();
    const name = filename.replace(/\.[^.]+$/, '');
    return {
      id: `folder:${filename}`,
      source: 'folder',
      name,
      ext,
      size: 0,
      type: `image/${ext.toLowerCase()}`,
      lastModified: 0,
      takenMs,
      src: folderImageUrl(filename),
      thumb: folderThumbUrl(filename),
      width: null,
      height: null,
      exif: {},
      exifLoaded: false,
    };
  });
}

function loadDefaultFolderImages() {
  buildPhotosFromManifest();
  return Promise.resolve();
}

async function ensureManifestLoaded() {
  if (window.GALLERY_MANIFEST?.length) {
    if (typeof window.GALLERY_MANIFEST[0] === 'object') return;
  }
  try {
    const resp = await fetch(`${folderPath()}/manifest.json`);
    if (!resp.ok) return;
    const data = await resp.json();
    window.GALLERY_MANIFEST = data.items || data.images || [];
  } catch (_) {}
}

async function ensurePhotoExif(photo) {
  if (photo.exifLoaded) return;
  photo.exifLoaded = true;
  try {
    const resp = await fetch(photo.src);
    if (!resp.ok) return;
    const buf = await resp.arrayBuffer();
    const exif = readExif(buf);
    photo.exif = exif;
    photo.takenMs = exifDateToMs(exif.dateTimeOriginal || exif.dateTime);
    const len = resp.headers.get('content-length');
    if (len) photo.size = parseInt(len, 10);
    if (exif.pixelXDimension && exif.pixelYDimension) {
      photo.width = exif.pixelXDimension;
      photo.height = exif.pixelYDimension;
    }
  } catch (_) {}
}

let galleryInitialized = false;
async function initGallery() {
  if (galleryInitialized) {
    updateMeta();
    renderGrid(true);
    return;
  }
  galleryInitialized = true;
  applyViewMode();
  updateViewButtons();
  await ensureManifestLoaded();
  await loadDefaultFolderImages();
  updateMeta();
  renderGrid(true);
}

// ── SORT / RENDER ─────────────────────────────────────────────
function getSortKey(p) {
  return p.takenMs || 0;
}

function getDate(p) {
  return p.takenMs || null;
}

function getSorted() {
  const p = [...allPhotos];
  if (sortMode === 'newest')  p.sort((a,b) => getSortKey(b) - getSortKey(a) || b.name.localeCompare(a.name));
  if (sortMode === 'oldest')  p.sort((a,b) => getSortKey(a) - getSortKey(b) || a.name.localeCompare(b.name));
  if (sortMode === 'name')    p.sort((a,b) => a.name.localeCompare(b.name));
  return p;
}

function setSort(btn, mode) {
  document.querySelectorAll('.sort-btn:not(.view-btn)').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  sortMode = mode;
  renderGrid(true);
}

function updateMeta() {
  const n = allPhotos.length;
  document.getElementById('hMeta').textContent = `${n} item${n === 1 ? '' : 's'}`;
}

function appendCard(p, i, animate) {
  const card = document.createElement('div');
  card.className = 'card';
  if (animate) card.style.animationDelay = Math.min(i * 0.03, 0.4) + 's';
  const displayDate = fmtShort(getDate(p));
  const img = document.createElement('img');
  img.src = p.thumb;
  img.alt = p.name;
  img.decoding = 'async';
  img.loading = 'lazy';
  img.onerror = () => { img.onerror = null; img.src = p.src; };

  const hover = document.createElement('div');
  hover.className = 'card-hover';
  hover.innerHTML = `
    <div class="card-name">${p.name}.${p.ext.toLowerCase()}</div>
    <div class="card-date">${displayDate}</div>`;

  card.appendChild(img);
  card.appendChild(hover);
  card.addEventListener('click', () => openLb(i));
  return card;
}

function updateLoadStatus() {
  const grid = document.getElementById('grid');
  let status = document.getElementById('loadStatus');
  if (renderedCount >= sorted.length) {
    status?.remove();
    return;
  }
  if (!status) {
    status = document.createElement('div');
    status.id = 'loadStatus';
    status.className = 'load-status';
    grid.appendChild(status);
  }
  status.textContent = `Showing ${renderedCount} of ${sorted.length}`;
}

function setupLoadMoreSentinel() {
  const grid = document.getElementById('grid');
  document.getElementById('loadMoreSentinel')?.remove();
  if (renderedCount >= sorted.length) {
    loadMoreObserver?.disconnect();
    updateLoadStatus();
    return;
  }

  const sentinel = document.createElement('div');
  sentinel.id = 'loadMoreSentinel';
  sentinel.className = 'load-sentinel';
  grid.appendChild(sentinel);
  updateLoadStatus();

  loadMoreObserver?.disconnect();
  loadMoreObserver = new IntersectionObserver(entries => {
    if (entries.some(entry => entry.isIntersecting)) loadMorePhotos();
  }, { rootMargin: '600px' });
  loadMoreObserver.observe(sentinel);
}

function loadMorePhotos() {
  if (isLoadingMore || renderedCount >= sorted.length) return;
  isLoadingMore = true;
  renderGrid(false);
  isLoadingMore = false;
}

function renderGrid(reset = true) {
  sorted = getSorted();
  const grid = document.getElementById('grid');

  if (!sorted.length) {
    loadMoreObserver?.disconnect();
    grid.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>No photos yet</span>
    </div>`;
    renderedCount = 0;
    return;
  }

  if (reset) {
    renderedCount = 0;
    grid.innerHTML = '';
  } else {
    document.getElementById('loadMoreSentinel')?.remove();
    document.getElementById('loadStatus')?.remove();
  }

  const end = Math.min(renderedCount + getPageSize(), sorted.length);
  for (let i = renderedCount; i < end; i++) {
    grid.appendChild(appendCard(sorted[i], i, reset && i < 8));
  }
  renderedCount = end;
  setupLoadMoreSentinel();
}

// ── FORMAT ────────────────────────────────────────────────────
function fmtShort(ms) {
  if (!ms) return '—';
  return new Date(ms).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtFull(ms) {
  if (!ms) return '—';
  return new Date(ms).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'})
    + ' · ' + new Date(ms).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}
function timeAgo(ms) {
  if (!ms) return 'Unknown date';
  const days = Math.floor((Date.now() - ms) / 864e5);
  if (days < 1)   return 'Today';
  if (days < 7)   return `${days}d ago`;
  if (days < 31)  return `${Math.floor(days/7)}w ago`;
  if (days < 365) return `${Math.floor(days/30)}mo ago`;
  const y = Math.floor(days/365), rem = Math.floor((days%365)/30);
  return rem > 0 ? `${y}y ${rem}mo ago` : `${y}y ago`;
}
function fmtSize(b) {
  if (!b) return '—';
  if (b < 1024)    return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
function fmtPx(w, h) { return (w && h) ? `${w} × ${h} px` : '—'; }
function fmtMp(w, h) { return (w && h) ? ((w*h)/1e6).toFixed(1) + ' MP' : '—'; }
function fmtAR(w, h) {
  if (!w || !h) return '—';
  const g = (a,b) => b ? g(b, a%b) : a;
  const d = g(w,h);
  return `${w/d} : ${h/d}`;
}

// ── LIGHTBOX ──────────────────────────────────────────────────
function openLb(i) {
  curIdx = i;
  const p = sorted[i];
  const img = document.getElementById('lbImg');
  img.style.opacity = '0';
  img.src = p.src;
  img.onload = () => {
    img.style.opacity = '1';
    if (!p.width || !p.height) {
      p.width = img.naturalWidth;
      p.height = img.naturalHeight;
    }
  };

  ensurePhotoExif(p).then(() => renderLbMeta(i));

  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderLbMeta(i) {
  const p = sorted[i];
  const dateMs = getDate(p);
  const ex = p.exif || {};
  const cameraLine = [ex.make, ex.model].filter(Boolean).join(' ') || null;

  document.getElementById('lbMeta').innerHTML = `
    <div class="lb-filename">${p.name}</div>
    <div class="lb-added">${timeAgo(dateMs)} &middot; ${fmtFull(dateMs)}${p.takenMs ? '' : ' <span style="color:var(--text-3);font-size:11px">(file date)</span>'}</div>

    <div class="meta-block">
      <div class="meta-block-title">File</div>
      <div class="meta-row"><span class="meta-key">Name</span><span class="meta-val hi">${p.name}.${p.ext.toLowerCase()}</span></div>
      <div class="meta-row"><span class="meta-key">Format</span><span class="meta-val hi">${p.ext}</span></div>
      <div class="meta-row"><span class="meta-key">Size</span><span class="meta-val">${fmtSize(p.size)}</span></div>
    </div>

    <div class="meta-block">
      <div class="meta-block-title">Image</div>
      <div class="meta-row"><span class="meta-key">Dimensions</span><span class="meta-val">${fmtPx(p.width, p.height)}</span></div>
      <div class="meta-row"><span class="meta-key">Megapixels</span><span class="meta-val">${fmtMp(p.width, p.height)}</span></div>
      <div class="meta-row"><span class="meta-key">Aspect ratio</span><span class="meta-val">${fmtAR(p.width, p.height)}</span></div>
    </div>

    ${cameraLine || ex.exposureTime || ex.fNumber || ex.iso || ex.focalLength ? `
    <div class="meta-block">
      <div class="meta-block-title">Camera</div>
      ${cameraLine ? `<div class="meta-row"><span class="meta-key">Device</span><span class="meta-val hi">${cameraLine}</span></div>` : ''}
      ${ex.fNumber    ? `<div class="meta-row"><span class="meta-key">Aperture</span><span class="meta-val">${fmtFStop(ex.fNumber)}</span></div>` : ''}
      ${ex.exposureTime ? `<div class="meta-row"><span class="meta-key">Shutter</span><span class="meta-val">${fmtExposure(ex.exposureTime)}</span></div>` : ''}
      ${ex.iso        ? `<div class="meta-row"><span class="meta-key">ISO</span><span class="meta-val">${ex.iso}</span></div>` : ''}
      ${ex.focalLength ? `<div class="meta-row"><span class="meta-key">Focal length</span><span class="meta-val">${fmtFocal(ex.focalLength)}</span></div>` : ''}
      ${ex.flash !== undefined ? `<div class="meta-row"><span class="meta-key">Flash</span><span class="meta-val">${ex.flash ? 'On' : 'Off'}</span></div>` : ''}
    </div>` : ''}

    <div class="meta-block">
      <div class="meta-block-title">In collection</div>
      <div class="meta-row"><span class="meta-key">Index</span><span class="meta-val">${i + 1} of ${sorted.length}</span></div>
    </div>
  `;
}

function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}
function lbBgClick(e) {
  if (e.target === e.currentTarget || e.target.classList.contains('lb-bg')) closeLb();
}
function navLb(dir) {
  curIdx = (curIdx + dir + sorted.length) % sorted.length;
  openLb(curIdx);
}

document.addEventListener('keydown', e => {
  const lb = document.getElementById('lb');
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLb();
  if (e.key === 'ArrowLeft')  navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
});

window.addEventListener('load', () => initGallery());

window.addEventListener('resize', () => {
  if (viewModeManual) return;
  viewMode = getDefaultViewMode();
  applyViewMode();
  updateViewButtons();
});
</script>
